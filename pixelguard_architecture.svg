<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Browser sends an image to the PixelGuard frontend, which calls the FastAPI backend. The backend extracts CV features, runs them through Random Forest models, stores the result in SQLite, and returns a JSON response to the frontend.</desc>
